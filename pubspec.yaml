name: gomotion
description: "GoMotion — an offline-first, fictional ride-hailing experience simulator built with Flutter."
publish_to: 'none'
version: 0.4.2+6

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.3
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/
    - assets/mascot/
